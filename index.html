<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Need Support Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="support-card">
        <div class="form-section">
            <h2>Need support?</h2>
            <p class="subtitle">Contact us if you need further assistance.</p>
            
            <form>
                <div class="input-group">
                    <label>Name and surname</label>
                    <input type="text">
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email">
                </div>

                <div class="input-group">
                    <label>Please enter the details of your request.</label>
                    <textarea></textarea>
                </div>

                <button type="submit" class="submit-btn">SUBMIT</button>
            </form>
        </div>
    </div>

</body>
</html>
